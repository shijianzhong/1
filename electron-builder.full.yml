# Full 安装包：含预置模型权重（build/kb-models，由 package:full 前的 scripts/fetch-kb-model.mjs 下载）。
# 与 electron-builder.slim.yml 的唯一差异：多 build/kb-models → resources/kb-models extraResources。
# 首启经 getKbStatus()→seedBuiltinModel 把 resources/kb-models 复制进 userData/kb-models 可写层，
# 之后离线即用（slim 包则运行时下载）。详见 docs/VECTOR_KB_PLAN.md §三 + CLAUDE.md 决策。
appId: com.shijianzhong.one
productName: One
# 产物名带 -full 后缀，避免与 slim 包同名冲突（同 tag 同平台 release 内共存）。
artifactName: ${productName}-${version}-${os}-${arch}-full.${ext}
# 独立 full 通道：生成 latest-full-*.yml，绝不覆盖 slim 的 latest-*.yml（auto-updater 默认通道）。
# 注：full 客户端目前不强制走 full 通道（air-gapped 本就无法访问 GitHub；在线 full 用户回落默认通道更新到 slim 即可，
# 仅多下一次 ~22MB 模型）。如需 full 客户端也走 full 通道自动更新，再在 app 内按 resources 是否含 kb-models 设 autoUpdater.channel='full'。
publish:
  provider: github
  owner: shijianzhong
  repo: '1'
  channel: full
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  # OpenCLI 随包分发（vendor:opencli 生成）
  - from: vendor/opencli/node_modules
    to: opencli/node_modules
  - from: build/icons/trayTemplate.png
    to: trayTemplate.png
  - from: build/icons/tray.png
    to: trayColor.png
  # 内置资产（docs/CONTENT_PIPELINE_PLAN.md §2.5）
  - from: build/builtin
    to: builtin
  # —— 向量知识库 worker 运行时（同 slim.yml）——
  - from: src/main/vector/worker-embed.cjs
    to: vector/worker-embed.cjs
  - from: node_modules/@huggingface/transformers/dist/transformers.web.js
    to: vector/node_modules/@huggingface/transformers/dist/transformers.web.js
  - from: node_modules/onnxruntime-web
    to: vector/node_modules/onnxruntime-web
  - from: node_modules/onnxruntime-common
    to: vector/node_modules/onnxruntime-common
  - from: node_modules/@huggingface/jinja
    to: vector/node_modules/@huggingface/jinja
  - from: node_modules/@huggingface/tokenizers
    to: vector/node_modules/@huggingface/tokenizers
  # —— 预置模型权重（full 包独有；slim 包运行时从 hf-mirror 下载到 userData）——
  # build/kb-models 由 scripts/fetch-kb-model.mjs 在 package:full 前下载，不入 git。
  - from: build/kb-models
    to: kb-models
mac:
  category: public.app-category.productivity
  icon: build/icons/logo.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
win:
  icon: build/icons/logo.ico
  target:
    - nsis
linux:
  icon: build/icons/logo_trans.png
  target:
    - AppImage
