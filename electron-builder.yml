appId: com.shijianzhong.one
productName: One
# 自动更新 feed（生成 app-update.yml）。与 git remote origin 一致（shijianzhong/1）。
# 注意：CI 打出的 draft release 对 /releases/latest 不可见，需在 GitHub 上 Publish 后 updater 才生效。
# 灰度发布：stagingPercentage 令 electron-updater 仅按比例放量；观察稳定后把已发布
# latest-*.yml 中的 stagingPercentage 改为 100 即可全量推送，无需重新出包。
publish:
  provider: github
  owner: shijianzhong
  repo: '1'
  stagingPercentage: 25
directories:
  output: release
files:
  - out/**
  - package.json
# OpenCLI 随包分发：vendor/opencli 由 `npm run vendor:opencli` 生成（独立 prefix 安装，
# 自含全部依赖）；运行时经 ELECTRON_RUN_AS_NODE 用主二进制执行，用户零安装。
# 图标：应用图标用 build/icons 下多尺寸合规资源（mac .icns / win .ico / linux .png）；
# 托盘用 build/icons/tray.png（带 alpha 的 32x32），extraResources 复制到 app 运行时读取。
extraResources:
  - from: vendor/opencli/node_modules
    to: opencli/node_modules
  - from: build/icons/trayTemplate.png
    to: trayTemplate.png
  - from: build/icons/tray.png
    to: trayColor.png
  # 内置资产随包出厂（docs/CONTENT_PIPELINE_PLAN.md §2.5）：
  # build/builtin（agent/skill/capability/样文/模板）→ process.resourcesPath/builtin，
  # 首启经 seedBuiltinAssets 复制进 userData 可写层，用户可改可分享。
  - from: build/builtin
    to: builtin
mac:
  category: public.app-category.productivity
  icon: build/icons/logo.icns
  # 代码签名 + 公证：按 CI secrets 自动启用（electron-builder 26 标准 env 检测）。
  # 需在仓库 Secrets 配置以下 5 项，缺一不可（缺少证书时保持未签名构建，不报错）：
  #   CSC_LINK                    Developer ID Application 证书导出的 .p12 的 base64
  #   CSC_KEY_PASSWORD            .p12 的导出密码
  #   APPLE_ID                    开发者 Apple ID（邮箱）
  #   APPLE_APP_SPECIFIC_PASSWORD 专用密码（appleid.apple.com 生成）
  #   APPLE_TEAM_ID               团队 ID（开发者后台获取）
  # 仅设置 APPLE_* 而缺少 CSC_LINK 会导致 mac 构建签名失败，务必五者同时配置。
  target:
    - target: dmg
      arch:
        - x64
        - arm64
win:
  icon: build/icons/logo.ico
  target:
    - nsis
linux:
  icon: build/icons/logo_trans.png
  target:
    - AppImage
