<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One</title>
    <style>
      /* 启动屏：JS bundle 加载前的占位（治打包版冷启动白屏）。
         纯 inline 无依赖，React 挂载后 createRoot 自动替换 #root 内容。
         配色与窗口 backgroundColor(#FCFCFD)/默认点缀色(#4ECDC4)一致。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fcfcfd;
        color: #1f2329;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Helvetica Neue', Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .boot-inner {
        display: grid;
        justify-items: center;
        gap: 22px;
      }
      .boot-mark {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: #ffffff;
        background: linear-gradient(145deg, #5fd9cb 0%, #4ecdc4 55%, #3db8ae 100%);
        box-shadow:
          0 12px 32px rgba(78, 205, 196, 0.35),
          0 2px 8px rgba(78, 205, 196, 0.25);
        animation: boot-breathe 2.2s ease-in-out infinite;
      }
      .boot-dots {
        display: flex;
        gap: 7px;
      }
      .boot-dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ecdc4;
        opacity: 0.25;
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      .boot-dots i:nth-child(2) {
        animation-delay: 0.18s;
      }
      .boot-dots i:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.045);
        }
      }
      @keyframes boot-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-dots i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" aria-hidden="true">
        <div class="boot-inner">
          <div class="boot-mark">One</div>
          <div class="boot-dots"><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>
    <!-- 同步早埋点（非 module）：在大包求值前记下 HTML 阶段原点 → userData/logs/startup.log -->
    <script src="./boot-mark.js"></script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
